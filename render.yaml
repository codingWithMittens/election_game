services:
  # Backend API + WebSocket Server
  - type: web
    name: election-game-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: election-game-db
          property: connectionString
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: election-game-frontend
          property: host
          envVarKey: CORS_ORIGIN
      - key: PORT
        value: 3000
    healthCheckPath: /api/health

  # Frontend
  - type: web
    name: election-game-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: election-game-backend
          property: host
          envVarKey: VITE_API_URL
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: election-game-backend
          property: host
          envVarKey: VITE_SOCKET_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: election-game-db
    plan: free
    databaseName: electoral_strategy
    user: electoral_user
